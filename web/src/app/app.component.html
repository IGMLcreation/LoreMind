<app-update-banner></app-update-banner>

<div class="app-container">
  <!-- Barre haute (< 1024 px) : ouvre les tiroirs menu / arborescence. Masquée en CSS sur desktop. -->
  <header class="mobile-topbar">
    <button #mainToggle type="button" class="topbar-btn"
      aria-controls="app-main-nav"
      [attr.aria-expanded]="openDrawer() === 'main'"
      [attr.aria-label]="(openDrawer() === 'main' ? 'mobileShell.closeMenu' : 'mobileShell.openMenu') | translate"
      (click)="toggleDrawer('main')">
      <lucide-icon [img]="openDrawer() === 'main' ? X : Menu" [size]="20"></lucide-icon>
    </button>
    @if (sidebarConfig$ | async; as config) {
      <button #treeToggle type="button" class="topbar-btn topbar-tree"
        aria-controls="app-tree-nav"
        [attr.aria-expanded]="openDrawer() === 'tree'"
        [attr.aria-label]="(openDrawer() === 'tree' ? 'mobileShell.closeTree' : 'mobileShell.openTree') | translate"
        (click)="toggleDrawer('tree')">
        <lucide-icon [img]="PanelLeft" [size]="18"></lucide-icon>
        <span class="topbar-title">{{ config.title }}</span>
      </button>
    } @else {
      <span class="topbar-brand">
        <img src="assets/logo.png" alt="" />
        <span>DM Loremind</span>
      </span>
    }
    <!-- Séance en cours : un tap y ramène (visible seulement si une séance tourne). -->
    <app-active-session-shortcut compact class="topbar-session"></app-active-session-shortcut>
    <button type="button" class="topbar-btn topbar-search"
      [attr.aria-label]="'mobileShell.search' | translate"
      (click)="openSearch()">
      <lucide-icon [img]="Search" [size]="18"></lucide-icon>
    </button>
  </header>

  <app-sidebar id="app-main-nav"
    [class.drawer-open]="openDrawer() === 'main'"
    [attr.role]="isCompact() ? 'dialog' : null"
    [attr.aria-modal]="isCompact() && openDrawer() === 'main' ? 'true' : null"
    [attr.aria-label]="'mobileShell.mainNav' | translate"></app-sidebar>

  @if (sidebarConfig$ | async; as config) {
    <app-secondary-sidebar id="app-tree-nav"
      [class.drawer-open]="openDrawer() === 'tree'"
      [attr.role]="isCompact() ? 'dialog' : null"
      [attr.aria-modal]="isCompact() && openDrawer() === 'tree' ? 'true' : null"
      [attr.aria-label]="'mobileShell.treeNav' | translate"
      [drawerMode]="isCompact()"
      [title]="config.title"
      [titleRoute]="config.titleRoute || null"
      [items]="config.items"
      [createActions]="config.createActions"
      [bottomPanel]="config.bottomPanel || null"
      [rootDropKinds]="config.rootDropKinds || null"
      [rootDropParentId]="config.rootDropParentId ?? null"
      [reorderContext]="config.reorderContext || null">
    </app-secondary-sidebar>
  }

  @if (openDrawer()) {
    <div class="drawer-backdrop" aria-hidden="true" (click)="closeDrawer()"></div>
  }

  <main #mainContent class="main-content" tabindex="-1">
    <app-campaign-breadcrumb></app-campaign-breadcrumb>
    <router-outlet></router-outlet>
  </main>
</div>

<app-global-search></app-global-search>
<app-confirm-dialog-host></app-confirm-dialog-host>
<app-writing-coach-panel></app-writing-coach-panel>
