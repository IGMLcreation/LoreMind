@if (items.length) {
  <nav class="breadcrumb" [attr.aria-label]="'breadcrumb.ariaLabel' | translate">
    <ol>
      @for (item of items; track $index; let last = $last) {
        <li
          class="breadcrumb-item"
          [class.current]="last">
          @if (item.route && !last) {
            <a
              [routerLink]="item.route"
            class="breadcrumb-link">{{ item.label }}</a>
          }
          @if (!item.route || last) {
            <span class="breadcrumb-text" [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
          }
        </li>
      }
    </ol>
  </nav>
}
